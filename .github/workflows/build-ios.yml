name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          # Ensure maximum compatibility with Xcode 15 and 16
          sed -i '' -e 's/objectVersion = [0-9]*/objectVersion = 56/g' Ztv.xcodeproj/project.pbxproj || true
          sed -i '' -e 's/compatibilityVersion = "Xcode [0-9.]*"/compatibilityVersion = "Xcode 15.0"/g' Ztv.xcodeproj/project.pbxproj || true

      - name: Build iOS App (Ad-Hoc / Unsigned for Sideloading)
        run: |
          xcodebuild -project Ztv.xcodeproj \
            -scheme Ztv \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into Direct IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ./build -name "Ztv.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r -y Ztv.ipa Payload
          rm -rf Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ztv-IPA
          path: Ztv.ipa
          retention-days: 30

      - name: Publish Direct Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "Ztv iOS Release v1.0.0 (Direct IPA)"
          body: |
            ### 📱 Ztv iOS IPA (Ready for Direct Signing)
            
            ملف الـ IPA المباشر جاهز الآن للتحميل والتوقيع بشهادتك الخاصة:
            * **اسم التطبيق:** Ztv
            * **طريقة التثبيت:** قم بتحميل `Ztv.ipa` مباشرة إلى هاتفك ووقعه عبر (ESign / Scarlet / GBox / Feather / TrollStore / AltStore).
            * **المعمارية:** SwiftUI + Apple JavaScriptCore Scraper Engine
          files: Ztv.ipa
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
